name: PR - Metalava Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metalava:
    uses: ./.github/workflows/_reusable_gradle_check.yml
    with:
      upload-metalava-reports: true
      tasks-json: >-
        [
          {"name": "metalavaCheck", "command": "core:metalavaCheckCompatibility android:metalavaCheckCompatibility glance:metalavaCheckCompatibilityRelease wear:metalavaCheckCompatibilityRelease --parallel", "artifact": "", "path": ""}
        ]
