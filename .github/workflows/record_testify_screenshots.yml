name: Record Testify Screenshots

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which preview suite to record'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'android'
          - 'glance'
          - 'wear'
  push:
    branches:
      - feature/add_android_testify_job

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - id: 'android-shard-1'
            name: 'Record Android Previews (1/3)'
            suite: 'android'
            command: 'testifyAndroidPreviews -PnumShards=3 -PshardIndex=0 -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect'
          - id: 'android-shard-2'
            name: 'Record Android Previews (2/3)'
            suite: 'android'
            command: 'testifyAndroidPreviews -PnumShards=3 -PshardIndex=1 -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect'
          - id: 'android-shard-3'
            name: 'Record Android Previews (3/3)'
            suite: 'android'
            command: 'testifyAndroidPreviews -PnumShards=3 -PshardIndex=2 -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect'
          - id: 'glance'
            name: 'Record Glance Previews'
            suite: 'glance'
            command: 'testifyGlancePreviews -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect'
          - id: 'wear'
            name: 'Record Wear Tile Previews'
            suite: 'wear'
            command: 'testifyWearTilePreviews -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect'
    name: ${{ matrix.task.name }}
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.task.suite
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record Screenshots
        run: ./gradlew ${{ matrix.task.command }}

      - name: Upload Recorded Screenshots Shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testify-screenshots-${{ matrix.task.id }}
          path: tests/src/androidTest/assets/screenshots/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload failure outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testify-failure-${{ matrix.task.id }}
          path: tests/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 7

  combine-screenshots:
    needs: record
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Download all screenshot shards
        uses: actions/download-artifact@v4
        with:
          pattern: testify-screenshots-*
          merge-multiple: true
          path: combined-screenshots

      - name: Upload combined recorded screenshots
        uses: actions/upload-artifact@v4
        with:
          name: testify-recorded-screenshots
          path: combined-screenshots/
          retention-days: 30
