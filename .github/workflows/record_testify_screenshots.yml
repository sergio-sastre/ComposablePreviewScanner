name: Record Testify Screenshots

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which preview suite to record'
        required: true
        type: choice
        default: 'android'
        options:
          - 'android'
          - 'glance'
          - 'wear'
          - 'all'
      num_shards:
        description: 'Number of shards for Android tests (default: 3)'
        required: false
        type: string
        default: '3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    name: Record Testify Screenshots (${{ github.event.inputs.target }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record Screenshots
        run: |
          SHARDS="${{ github.event.inputs.num_shards || '3' }}"
          case "${{ github.event.inputs.target }}" in
            android)
              ./gradlew testifyAndroidPreviews -PnumShards=$SHARDS
              ;;
            glance)
              ./gradlew testifyGlancePreviews
              ;;
            wear)
              ./gradlew testifyWearTilePreviews
              ;;
            all)
              ./gradlew testifyPreviews -PnumShards=$SHARDS
              ;;
          esac

      - name: Upload Recorded Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testify-recorded-screenshots
          path: tests/src/androidTest/assets/screenshots/
          retention-days: 30

      - name: Upload failure outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testify-failure-outputs
          path: tests/build/outputs/managed_device_android_test_additional_output/
          retention-days: 7
