name: PR - API Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: ./.github/workflows/_reusable_gradle_check.yml
    with:
      tasks-json: >-
        [
          {"name": "testApi", "command": ":tests:testApi", "artifact": "test-api-reports", "path": "tests/build/reports/tests/"},
          {"name": "paparazziPreviewsRuntime", "command": "paparazziPreviewsRuntime -Pverify=true", "artifact": "paparazzi-runtime-reports", "path": "tests/build/paparazzi/\ntests/build/reports/paparazzi/"},
          {"name": "roborazziPreviewsRuntime", "command": "roborazziPreviewsRuntime -Pverify=true", "artifact": "roborazzi-runtime-reports", "path": "tests/build/reports/roborazzi/\ntests/build/outputs/roborazzi/"}
        ]
