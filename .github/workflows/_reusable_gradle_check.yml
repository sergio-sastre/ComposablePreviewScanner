name: Reusable PR Gradle Check

on:
  workflow_call:
    inputs:
      tasks-json:
        required: true
        type: string
      is-testify:
        required: false
        type: boolean
        default: false
      upload-metalava-reports:
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(inputs.tasks-json) }}
    name: ${{ matrix.task.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android Emulator
        if: ${{ inputs.is-testify }}
        uses: ./.github/actions/setup-android-emulator

      - name: Cache AVD System Images
        if: ${{ inputs.is-testify }}
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: android-system-images-v2-${{ runner.os }}-${{ matrix.task.name }}

      - name: Run ${{ matrix.task.name }}
        run: ./gradlew ${{ matrix.task.command }} --stacktrace

      - name: Upload reports
        if: ${{ always() && matrix.task.artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task.artifact }}
          path: ${{ matrix.task.path }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload metalava reports
        if: ${{ failure() && inputs.upload-metalava-reports }}
        uses: actions/upload-artifact@v4
        with:
          name: metalava-compatibility-reports
          path: |
            **/build/metalava/
          retention-days: 7

      - name: Upload Testify failure screenshots and diffs
        if: ${{ failure() && inputs.is-testify }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task.name }}-failure-outputs
          path: |
            tests/build/outputs/managed_device_android_test_additional_output/
            tests/build/intermediates/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 7
