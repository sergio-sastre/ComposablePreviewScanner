name: PR - SourceSet Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sourceset:
    uses: ./.github/workflows/_reusable_gradle_check.yml
    with:
      tasks-json: >-
        [
          {"name": "testSourceSets", "command": ":tests:testSourceSets", "artifact": "test-source-sets-reports", "path": "tests/build/reports/tests/"},
          {"name": "paparazziPreviewsSourceSet", "command": "paparazziPreviewsSourceSet -Pverify=true", "artifact": "paparazzi-source-set-reports", "path": "tests/build/paparazzi/\ntests/build/reports/paparazzi/"},
          {"name": "roborazziPreviewsSourceSet", "command": "roborazziPreviewsSourceSet -Pverify=true", "artifact": "roborazzi-source-set-reports", "path": "tests/build/reports/roborazzi/\ntests/build/outputs/roborazzi/"}
        ]
