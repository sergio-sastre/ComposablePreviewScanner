name: Setup Android Emulator
description: Enable KVM, export ANDROID_HOME, accept SDK licenses, and ensure the emulator package is installed.

runs:
  using: composite
  steps:
    - name: Enable KVM for Emulator
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Export Android SDK path
      shell: bash
      run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

    - name: Accept Android SDK licenses & ensure emulator is installed
      shell: bash
      run: |
        SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $ANDROID_HOME" >&2
          exit 1
        fi
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" "emulator"
